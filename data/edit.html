<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clips - Edit Page</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/modal.css">
</head>
<body>
    <header class="header">
        <div class="logo">ClipsApp</div>
        <nav class="nav">
            <a href="index.html">View Clips</a>
            <a href="create.html">Create Clip</a>
        </nav>
    </header>

    <main class="container form-container">
        <h2>Редагувати кліп</h2>
        <form id="editClipForm" novalidate>
            <div class="form-group">
                <label for="artistName">Ім'я виконавця:</label>
                <input type="text" id="artistName" name="artistName" required placeholder="Наприклад, The Beatles">
            </div>

            <div class="form-group">
                <label for="songTitle">Назва пісні:</label>
                <input type="text" id="songTitle" name="songTitle" required placeholder="Наприклад, Let It Be">
            </div>

            <div class="form-group">
                <label for="duration">Тривалість (в секундах):</label>
                <input type="number" id="duration" name="duration" required min="1" placeholder="Наприклад, 240">
            </div>

            <div class="form-group">
                <label for="views">Кількість переглядів на YouTube:</label>
                <input type="number" id="views" name="views" required min="0" placeholder="Наприклад, 1500000">
            </div>

            <button type="submit" class="submit-btn">Зберегти</button>
            <a href="./index.html" style="display:block; text-align:center; margin-top:12px; color:#666; text-decoration:none;">Скасувати і повернутися</a>
        </form>
    </main>

    <div id="errorModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">Помилка валідації!</h3>
            <p id="modalErrorMessage">Будь ласка, перевірте введені дані.</p>
            <button id="modalOkBtn" class="modal-ok-btn">Зрозуміло</button>
        </div>
    </div>

    <script src="../js/modal.js"></script>
    <script type="module" src="../js/edit.js"></script>
</body>
</html>
